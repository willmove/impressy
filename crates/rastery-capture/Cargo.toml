[package]
name = "rastery-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rastery 系统集成：屏幕捕获 / 全局热键 / 剪贴板 / 取色 + 标注合成。"

[lints]
workspace = true

# 真实平台后端（xcap / arboard / global-hotkey）需要显示服务器与系统库
# （wayland / pipewire / xcb…），无头 VM 上既无法链接也无从验证行为，故放在
# 默认关闭的 `system` feature 后：
#   - 默认构建（无头 VM、CI 的基础 check）只编译纯 `annotate` + trait + Null 占位，保持全绿；
#   - 真机以 `--features system` 构建，得到真实截图 / 热键 / 剪贴板 / 取色后端。
# 详见 device.rs 顶部说明与 ADR-0002。
[features]
default = []
system = ["dep:xcap", "dep:arboard", "dep:global-hotkey"]

[dependencies]
image = "=0.25.8"
thiserror = "2"
async-trait = "0.1"
xcap = { version = "0.9.6", optional = true }
arboard = { version = "3.6.1", optional = true, features = ["image-data"] }
global-hotkey = { version = "0.8.0", optional = true }

[dev-dependencies]
proptest = "1"
