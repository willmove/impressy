<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="logo-title logo-description">
  <title id="logo-title">Rastery logo</title>
  <desc id="logo-description">A pixel letter R inside an image crop frame.</desc>

  <defs>
    <linearGradient id="background" x1="80" y1="64" x2="432" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242832"/>
      <stop offset="1" stop-color="#14161C"/>
    </linearGradient>
    <linearGradient id="accent" x1="144" y1="136" x2="368" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43D7FF"/>
      <stop offset="1" stop-color="#8066FF"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#background)"/>
  <rect x="33" y="33" width="446" height="446" rx="103"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Screen-capture frame -->
  <path d="M188 112H150C129 112 112 129 112 150V188
           M324 112H362C383 112 400 129 400 150V188
           M188 400H150C129 400 112 383 112 362V324
           M324 400H362C383 400 400 383 400 362V324"
        fill="none"
        stroke="#F7FAFF"
        stroke-opacity="0.92"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Raster-built R -->
  <g fill="url(#accent)">
    <rect x="178" y="150" width="44" height="44" rx="9"/>
    <rect x="234" y="150" width="44" height="44" rx="9"/>
    <rect x="290" y="150" width="44" height="44" rx="9"/>

    <rect x="178" y="206" width="44" height="44" rx="9"/>
    <rect x="290" y="206" width="44" height="44" rx="9"/>

    <rect x="178" y="262" width="44" height="44" rx="9"/>
    <rect x="234" y="262" width="44" height="44" rx="9"/>

    <rect x="178" y="318" width="44" height="44" rx="9"/>
    <rect x="290" y="318" width="44" height="44" rx="9"/>
  </g>
</svg>
