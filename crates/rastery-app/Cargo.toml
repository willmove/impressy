[package]
name = "rastery-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rastery 桌面应用：GPUI 主窗口与四板块导航。"

# 包名保持 rastery-app（供 workspace 内 `-p rastery-app` 与路径依赖引用），
# 但产出的可执行文件名为 rastery。
[[bin]]
name = "rastery"
path = "src/main.rs"

[features]
# 启用后转发到 rastery-capture 的真实平台后端（xcap / arboard / global-hotkey）。
# 无头 VM 与 CI 基础 check 不启用——见 ADR-0002。
system = ["rastery-capture/system"]

[lints]
workspace = true

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
image = "=0.25.8"
rastery-capture = { version = "0.1.0", path = "../rastery-capture" }
rastery-core = { path = "../rastery-core" }
rfd = "0.17.2"
rust-i18n = "3"
