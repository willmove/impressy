[package]
name = "rastery-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rastery 桌面应用：GPUI 主窗口与四板块导航。"

# 包名保持 rastery-app（供 workspace 内 `-p rastery-app` 与路径依赖引用），
# 但产出的可执行文件名为 rastery。
[[bin]]
name = "rastery"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-channel = "=2.5.0"
cosmic-text = "=0.14.2"
directories = "6.0.0"
env_logger = "0.11.11"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
image = "=0.25.8"
log = "0.4.33"
rastery-core = { path = "../rastery-core" }
rust-i18n = "3"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "=0.1.31"

[package.metadata.bundle]
name = "Rastery"
identifier = "app.rastery.Rastery"
icon = [
    "assets/icons/png/32x32.png",
    "assets/icons/png/128x128.png",
    "assets/icons/png/256x256.png",
    "assets/icons/rastery.icns",
    "assets/icons/rastery.ico",
]
category = "Graphics and Design"
short_description = "A lightweight local image processing toolbox"
long_description = "Rastery provides fast, offline image editing, conversion, compression, collage, slicing, QR, EXIF, watermark, and GIF tools."

[package.metadata.wix]
product-icon = "assets/icons/rastery.ico"
