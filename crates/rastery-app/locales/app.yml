feature:
  edit:
    name:
      en: Crop / Resize / Rotate
      zh-CN: 裁剪 / 缩放 / 旋转
    desc:
      en: Aspect-ratio presets, lossless rotation, high-quality resampling.
      zh-CN: 比例预设、无损旋转、高质量重采样。
    detail:
      en: Powered by rastery-core transform operations and exact aspect-ratio math.
      zh-CN: 由 rastery-core 变换能力与精确比例计算驱动。
  collage:
    name:
      en: Collage
      zh-CN: 拼图拼接
    desc:
      en: Combine images vertically, horizontally, or in a grid.
      zh-CN: 纵向、横向或网格拼接多张图片。
    detail:
      en: Vertical, horizontal, and centered grid composition.
      zh-CN: 支持纵向、横向与居中网格拼接。
  batch:
    name:
      en: Batch Processing
      zh-CN: 批量处理
    desc:
      en: Convert, compress, resize, or watermark many images at once.
      zh-CN: 批量转换、压缩、缩放或加水印，失败项单独标记。
    detail:
      en: Per-item failures do not interrupt the remaining batch.
      zh-CN: 单项失败不会中断其余批处理任务。
  slice:
    name:
      en: Slicing
      zh-CN: 切图
    desc:
      en: Split an image into an N×M grid of tiles.
      zh-CN: 把图片按 N×M 网格切成多块。
    detail:
      en: Produces exactly rows × columns tiles without dropping remainder pixels.
      zh-CN: 精确产出“行 × 列”块，余数像素不会丢失。
  qrcode:
    name:
      en: QR Code
      zh-CN: 二维码
    desc:
      en: Generate and recognize QR codes with custom colors.
      zh-CN: 生成与识别二维码，支持自定义颜色与纠错级别。
    detail:
      en: Quiet-zone-aware generation and local recognition.
      zh-CN: 支持静区的二维码生成与本地识别。
  exif:
    name:
      en: EXIF Manager
      zh-CN: EXIF 管理
    desc:
      en: View and strip camera/GPS metadata without touching pixels.
      zh-CN: 查看并清除相机 / GPS 元数据，像素不变。
    detail:
      en: Container-level metadata removal preserves encoded pixels and is idempotent.
      zh-CN: 在容器层清除元数据，保持像素且可幂等重复执行。
  beautify:
    name:
      en: Screenshot Beautify
      zh-CN: 截图美化
    desc:
      en: Rounded corners, padding, gradients, borders, and shadows.
      zh-CN: 圆角、内边距、渐变背景、描边与阴影。
    detail:
      en: Rounded corners, padding, backgrounds, borders, and shadows are composed locally.
      zh-CN: 圆角、边距、背景、描边与阴影均在本地合成。
  gif:
    name:
      en: GIF Maker
      zh-CN: GIF 制作
    desc:
      en: Turn frames into a GIF with delay and playback modes.
      zh-CN: 把多帧合成 GIF，可设延迟与播放模式。
    detail:
      en: Supports forward, reverse, and ping-pong playback with 100–800 ms delay.
      zh-CN: 支持正序、倒序、乒乓播放与 100–800 毫秒帧延迟。
  poster:
    name:
      en: Poster Design
      zh-CN: 海报设计
    desc:
      en: Layered poster design over AI backdrops.
      zh-CN: 基于 AI 底图的图层化海报设计。
  text_to_image:
    name:
      en: Text to Image
      zh-CN: 文生图
    desc:
      en: Generate images from prompts via BYOK providers.
      zh-CN: 通过自备 API Key 的服务商从提示词生成图像。
  image_edit:
    name:
      en: AI Image Editing
      zh-CN: AI 改图
    desc:
      en: Preset AI editing scenarios.
      zh-CN: 预置 AI 改图场景。
  video_watermark:
    name:
      en: Video Watermark Removal
      zh-CN: 视频去水印
    desc:
      en: Remove watermarks from video.
      zh-CN: 去除视频中的水印。
  video_subtitle:
    name:
      en: Video Subtitle Removal
      zh-CN: 视频去字幕
    desc:
      en: Remove burned-in subtitles from video.
      zh-CN: 去除视频中的硬字幕。
  video_clarity:
    name:
      en: Video Clarity Enhancement
      zh-CN: 视频清晰度增强
    desc:
      en: Upscale and sharpen video.
      zh-CN: 提升视频清晰度。
  industry:
    name:
      en: Specialized AI Tools
      zh-CN: 行业专用 AI 工具
    desc:
      en: "13 industry tools: ID photos, avatars, product shots, and more."
      zh-CN: 13 项行业工具：证件照、头像、商品图等。
