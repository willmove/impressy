[package]
name = "impressy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Impressy 本地图像引擎：裁剪/压缩/拼接/切图/GIF/二维码/EXIF/水印。纯函数，无 UI 无网络。"

[lints]
workspace = true

[dependencies]
fast_image_resize = "6.0.0"
gif = "0.14.2"
image = "=0.25.8"
imageproc = "0.27.0"
img-parts = "0.4.0"
kamadak-exif = "0.6.1"
qrcode = "0.14.1"
rxing = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.3"
webp = "0.3.1"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
image = "=0.25.8"
gif = "0.14.2"
img-parts = "0.4.0"
sha2 = "0.10.9"

[[bench]]
name = "v1_local"
harness = false
