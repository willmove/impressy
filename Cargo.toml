[workspace]
resolver = "3"
members = [
    "crates/rastery-ai",
    "crates/rastery-app",
    "crates/rastery-core",
    "crates/rastery-presets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

# gpui 0.2.2 -> stacksafe 0.1.4 pins proc-macro-error2 2.0.1. Rust's
# future-incompat lint E0365 requires its proc_macro re-export source to be public.
# Remove this patch when a synchronized GPUI upgrade no longer needs it.
[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2-2.0.1" }
