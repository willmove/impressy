name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-msi:
    name: Signed Windows x64 MSI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build release executable
        run: cargo build --release -p rastery-app

      - name: Verify executable resources
        shell: pwsh
        run: |
          $version = (Get-Item "target\release\rastery.exe").VersionInfo
          if ($version.ProductName -ne "Rastery") {
            throw "rastery.exe does not contain the expected Windows resources."
          }
          if (-not (Test-Path "crates\rastery-app\assets\icons\rastery.ico")) {
            throw "The generated Windows icon is missing."
          }

      - name: Decode signing certificate and locate SignTool
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for release packaging."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "rastery-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "SignTool was not found in the Windows SDK." }
          "certificate=$certificatePath" >> $env:GITHUB_OUTPUT
          "signtool=$($signTool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign executable
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & "${{ steps.signing.outputs.signtool }}" sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f "${{ steps.signing.outputs.certificate }}" `
            /p "$env:CERTIFICATE_PASSWORD" `
            "target\release\rastery.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing rastery.exe failed." }

      - name: Build MSI without rebuilding the signed executable
        run: cargo wix --package rastery-app --no-build

      - name: Sign and verify MSI
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msi = Get-ChildItem "target\wix" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "cargo-wix did not produce an MSI." }
          & "${{ steps.signing.outputs.signtool }}" sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f "${{ steps.signing.outputs.certificate }}" `
            /p "$env:CERTIFICATE_PASSWORD" `
            $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing MSI failed." }
          & "${{ steps.signing.outputs.signtool }}" verify /pa /all $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSI signature verification failed." }

      - name: Enforce 30 MB package limit
        shell: pwsh
        run: |
          $limit = 30MB
          $artifacts = @(
            Get-Item "target\release\rastery.exe"
            Get-ChildItem "target\wix" -Filter *.msi | Select-Object -First 1
          )
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -gt $limit) {
              throw "$($artifact.Name) is $($artifact.Length) bytes, above the 30 MB limit."
            }
            Write-Host "$($artifact.Name): $([math]::Round($artifact.Length / 1MB, 2)) MB"
          }

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: rastery-windows-x64-msi
          path: target/wix/*.msi
          if-no-files-found: error

  desktop-package:
    name: Desktop package for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GPUI link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install pinned cargo-bundle
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Build Linux release binary
        if: runner.os == 'Linux'
        run: cargo build --release -p rastery-app

      - name: Enforce Linux 30 MB binary limit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          size=$(wc -c < target/release/rastery)
          if [ "$size" -gt $((30 * 1024 * 1024)) ]; then
            echo "rastery is $size bytes, above the 30 MB limit" >&2
            exit 1
          fi
          echo "rastery: $size bytes"

      - name: Create Linux desktop archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          stage="target/linux-package"
          install -Dm755 target/release/rastery "$stage/usr/bin/rastery"
          install -Dm644 packaging/linux/app.rastery.Rastery.desktop \
            "$stage/usr/share/applications/app.rastery.Rastery.desktop"
          mkdir -p "$stage/usr/share/icons"
          cp -R crates/rastery-app/assets/icons/hicolor "$stage/usr/share/icons/"
          tar -C "$stage" -czf "target/rastery-${{ matrix.name }}.tar.gz" .

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: cargo bundle --release --package rastery-app

      - name: Verify and archive macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/release/bundle/osx/Rastery.app"
          test -x "$app/Contents/MacOS/rastery"
          test -s "$app/Contents/Resources/Rastery.icns"
          size=$(wc -c < "$app/Contents/MacOS/rastery")
          if [ "$size" -gt $((30 * 1024 * 1024)) ]; then
            echo "rastery is $size bytes, above the 30 MB limit" >&2
            exit 1
          fi
          tar -C target/release/bundle/osx -czf \
            "target/rastery-${{ matrix.name }}.tar.gz" Rastery.app

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: rastery-${{ matrix.name }}
          path: target/rastery-${{ matrix.name }}.tar.gz
          if-no-files-found: error
