name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  acceptance-gate:
    name: Verified desktop acceptance evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v1 desktop and performance acceptance
        run: python3 scripts/verify_desktop_acceptance.py

  windows-msi:
    name: Signed Windows x64 MSI
    needs: acceptance-gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build release executable
        run: cargo build --release --locked -p impressy-app

      - name: Verify executable resources
        shell: pwsh
        run: |
          $version = (Get-Item "target\release\impressy.exe").VersionInfo
          if ($version.ProductName -ne "Impressy") {
            throw "impressy.exe does not contain the expected Windows resources."
          }
          if (-not (Test-Path "crates\impressy-app\assets\icons\impressy.ico")) {
            throw "The generated Windows icon is missing."
          }

      - name: Decode signing certificate and locate SignTool
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for release packaging."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "impressy-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "SignTool was not found in the Windows SDK." }
          "certificate=$certificatePath" >> $env:GITHUB_OUTPUT
          "signtool=$($signTool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign executable
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & "${{ steps.signing.outputs.signtool }}" sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f "${{ steps.signing.outputs.certificate }}" `
            /p "$env:CERTIFICATE_PASSWORD" `
            "target\release\impressy.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing impressy.exe failed." }

      - name: Build MSI without rebuilding the signed executable
        run: cargo wix --package impressy-app --no-build

      - name: Sign and verify MSI
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $msi = Get-ChildItem "target\wix" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "cargo-wix did not produce an MSI." }
          & "${{ steps.signing.outputs.signtool }}" sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f "${{ steps.signing.outputs.certificate }}" `
            /p "$env:CERTIFICATE_PASSWORD" `
            $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing MSI failed." }
          & "${{ steps.signing.outputs.signtool }}" verify /pa /all $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSI signature verification failed." }

      - name: Enforce 30 MB package limit
        shell: pwsh
        run: |
          $limit = 30MB
          $artifacts = @(
            Get-Item "target\release\impressy.exe"
            Get-ChildItem "target\wix" -Filter *.msi | Select-Object -First 1
          )
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -gt $limit) {
              throw "$($artifact.Name) is $($artifact.Length) bytes, above the 30 MB limit."
            }
            Write-Host "$($artifact.Name): $([math]::Round($artifact.Length / 1MB, 2)) MB"
          }

      - name: Verify signed MSI install, associations, shortcut, and uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem "target\wix" -Filter *.msi | Select-Object -First 1).FullName
          $installLog = Join-Path $env:RUNNER_TEMP "impressy-msi-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "impressy-msi-uninstall.log"

          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$installLog`""
          )
          if ($install.ExitCode -ne 0) {
            Get-Content $installLog
            throw "MSI installation failed with exit code $($install.ExitCode)."
          }

          $installedExe = Join-Path $env:ProgramFiles "Impressy\impressy.exe"
          $shortcut = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\Impressy\Impressy.lnk"
          if (-not (Test-Path $installedExe)) {
            throw "MSI did not install impressy.exe."
          }
          if (-not (Test-Path $shortcut)) {
            throw "MSI did not install the Start menu shortcut."
          }
          foreach ($extension in "png", "jpg", "jpeg", "webp", "bmp", "gif") {
            $association = (Get-Item "Registry::HKEY_CLASSES_ROOT\.$extension").GetValue("")
            if ($association -ne "Impressy.Image") {
              throw ".$extension is not associated with Impressy.Image."
            }
          }
          $openCommand = (Get-Item "Registry::HKEY_CLASSES_ROOT\Impressy.Image\shell\open_png\command").GetValue("")
          if ($openCommand -notlike "*impressy.exe*`"%1`"*") {
            throw "The installed image open command is invalid: $openCommand"
          }

          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/x", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$uninstallLog`""
          )
          if ($uninstall.ExitCode -ne 0) {
            Get-Content $uninstallLog
            throw "MSI uninstallation failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path $installedExe) {
            throw "MSI uninstall left impressy.exe behind."
          }
          if (Test-Path $shortcut) {
            throw "MSI uninstall left the Start menu shortcut behind."
          }
          if (Test-Path "Registry::HKEY_CLASSES_ROOT\Impressy.Image") {
            throw "MSI uninstall left Impressy.Image registration behind."
          }

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: impressy-windows-x64-msi
          path: target/wix/*.msi
          if-no-files-found: error

  linux-deb:
    name: Linux x64 Debian package
    needs: acceptance-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GPUI link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Build Linux release binary
        run: cargo build --release --locked -p impressy-app

      - name: Build Debian package
        shell: bash
        run: |
          desktop-file-validate packaging/linux/app.impressy.Impressy.desktop
          version=$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "impressy-app"))')
          stage="target/deb/impressy_${version}_amd64"
          mkdir -p "$stage/DEBIAN"
          install -Dm755 target/release/impressy "$stage/usr/bin/impressy"
          install -Dm644 packaging/linux/app.impressy.Impressy.desktop \
            "$stage/usr/share/applications/app.impressy.Impressy.desktop"
          mkdir -p "$stage/usr/share/icons"
          cp -R crates/impressy-app/assets/icons/hicolor "$stage/usr/share/icons/"
          cat > "$stage/DEBIAN/control" <<EOF
          Package: impressy
          Version: ${version}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgcc-s1, libxcb1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libfontconfig1, libfreetype6
          Maintainer: Impressy <release@impressy.app>
          Description: Lightweight local image processing toolbox
           Native offline image editing, collage, batch processing, slicing,
           QR, EXIF, beautification, watermark, and GIF tools.
          EOF
          dpkg-deb --build --root-owner-group "$stage" "target/impressy_${version}_amd64.deb"

      - name: Verify package contents, dependencies, and size
        shell: bash
        run: |
          package=$(find target -maxdepth 1 -name 'impressy_*_amd64.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -F './usr/bin/impressy'
          dpkg-deb --contents "$package" | grep -F './usr/share/applications/app.impressy.Impressy.desktop'
          for artifact in target/release/impressy "$package"; do
            size=$(wc -c < "$artifact")
            if [ "$size" -gt $((30 * 1024 * 1024)) ]; then
              echo "$artifact is $size bytes, above the 30 MB limit" >&2
              exit 1
            fi
          done

          sudo dpkg -i "$package"
          test -x /usr/bin/impressy
          test -f /usr/share/applications/app.impressy.Impressy.desktop
          grep -F 'Exec=impressy %F' /usr/share/applications/app.impressy.Impressy.desktop
          sudo dpkg --verify impressy
          sudo dpkg -r impressy
          test ! -e /usr/bin/impressy
          test ! -e /usr/share/applications/app.impressy.Impressy.desktop

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: impressy-linux-x64-deb
          path: target/impressy_*_amd64.deb
          if-no-files-found: error

  macos-dmg:
    name: Signed and notarized macOS arm64 DMG
    needs: acceptance-gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned cargo-bundle
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Validate signing and notarization secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is required for a formal macOS release" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        id: keychain
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/impressy-release.p12"
          keychain="$RUNNER_TEMP/impressy-signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "path=$keychain" >> "$GITHUB_OUTPUT"

      - name: Build macOS application bundle
        run: cargo bundle --release --package impressy-app

      - name: Sign, notarize, and package DMG
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app="target/release/bundle/osx/Impressy.app"
          test -x "$app/Contents/MacOS/impressy"
          test -s "$app/Contents/Resources/Impressy.icns"
          codesign --deep --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          archive="$RUNNER_TEMP/Impressy-notary.zip"
          ditto -c -k --keepParent "$app" "$archive"
          xcrun notarytool submit "$archive" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

          dmg="target/Impressy-macos-arm64.dmg"
          hdiutil create -volname Impressy -srcfolder "$app" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

          for artifact in "$app/Contents/MacOS/impressy" "$dmg"; do
            size=$(wc -c < "$artifact")
            if [ "$size" -gt $((30 * 1024 * 1024)) ]; then
              echo "$artifact is $size bytes, above the 30 MB limit" >&2
              exit 1
            fi
          done

      - name: Upload signed and notarized DMG
        uses: actions/upload-artifact@v4
        with:
          name: impressy-macos-arm64-dmg
          path: target/Impressy-macos-arm64.dmg
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-msi, linux-deb, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: target/release-artifacts
          merge-multiple: true

      - name: Create release and upload verified installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --verify-tag --generate-notes --title "Impressy $tag"
          find target/release-artifacts -type f -print0 | \
            xargs -0 gh release upload "$tag" --clobber
